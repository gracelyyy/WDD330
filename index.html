<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sleep Outside outdoor gear store">
  <title>Sleep Outside</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
    }

    header {
      background: #333;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 2rem 1rem;
    }

    .hero {
      padding: 3rem 1rem;
      text-align: center;
      background: #eee;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .card {
      padding: 1.5rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }

    footer {
      margin-top: 3rem;
      padding: 1rem;
      text-align: center;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>
  <header>
    <h1>Sleep Outside</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Adventure Starts Here</h2>
      <p>Gear up for your next outdoor adventure.</p>
    </section>

    <section>
      <h2>Featured Gear</h2>

      <div class="products">
        <article class="card">
          <h3>Outdoor Tent</h3>
          <p>Reliable shelter for your next adventure.</p>
        </article>

        <article class="card">
          <h3>Sleeping Bag</h3>
          <p>Stay comfortable while sleeping outside.</p>
        </article>

        <article class="card">
          <h3>Backpack</h3>
          <p>Carry your essential outdoor gear.</p>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sleep Outside</p>
  </footer>
</body>
</html>
